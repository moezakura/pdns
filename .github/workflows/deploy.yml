name: Deploy to Self-Hosted Runners

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy-kokon-amane:
    runs-on: [self-hosted, Linux, X64, dns, kokon-amane]

    steps:
      - name: Ensure Docker uses external DNS
        run: |
          if [ ! -f /etc/docker/daemon.json ] || ! grep -q '1.1.1.1' /etc/docker/daemon.json; then
            echo '{"dns": ["1.1.1.1", "1.0.0.1"]}' | sudo tee /etc/docker/daemon.json
            sudo systemctl restart docker
            echo "Docker DNS configured to use 1.1.1.1 on kokon-amane"
          else
            echo "Docker DNS already configured on kokon-amane"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }}

      - name: Pull base images before stopping services
        run: |
          docker compose pull --ignore-buildable || true

      - name: Stop existing containers
        run: |
          docker compose down || true
          echo "Existing containers stopped on kokon-amane"

      - name: Remove unused Docker resources
        run: |
          docker system prune -f --volumes || true
          echo "Cleaned up unused Docker resources on kokon-amane"

      - name: Build and start containers
        run: |
          docker compose up -d --build
          echo "Containers started successfully on kokon-amane"

      - name: Wait for services to be ready
        run: |
          sleep 10
          docker compose ps

      - name: Check container health
        run: |
          docker compose ps --format "table {{.Name}}\t{{.Status}}\t{{.Service}}"
          echo "Deployment completed on kokon-amane at $(date)"

      - name: Show container logs (last 20 lines)
        if: always()
        run: |
          docker compose logs --tail=20

  deploy-kurumi-fuyu:
    runs-on: [self-hosted, Linux, X64, dns, kurumi-fuyu]

    steps:
